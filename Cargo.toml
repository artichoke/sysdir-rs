[package]
name = "sysdir"
version = "1.3.2" # remember to set `html_root_url` in `src/lib.rs`.
authors = ["Ryan Lopopolo <rjl@hyperbo.la>"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.85.0"
readme = "README.md"
repository = "https://github.com/artichoke/sysdir-rs"
documentation = "https://docs.rs/sysdir"
homepage = "https://github.com/artichoke/sysdir-rs"
description = "Rust bindings to sysdir(3) on macOS, iOS, tvOS, and watchOS"
keywords = ["app_dirs", "apple", "known-folder", "path", "sysdir"]
categories = [
  "api-bindings",
  "filesystem",
  "no-std",
  "no-std::no-alloc",
  "os::macos-apis",
]
include = [
  "/cext/**/*",
  "/examples/**/*",
  "/src/**/*",
  "/tests/**/*",
  "/LICENSE-*",
  "/README.md",
  "/sysdir.3",
]

[dependencies]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = [
  # Tier 1
  "x86_64-apple-darwin",
  # Tier 2
  "aarch64-apple-darwin",
  #  "aarch64-apple-ios",
  #  "aarch64-apple-ios-sim",
  # Tier 3
  #  "aarch64-apple-ios-macabi",
  #  "aarch64-apple-tvos",
  #  "aarch64-apple-watchos-sim",
  #  "arm64_32-apple-watchos",
  #  "armv7k-apple-watchos",
  #  "aarch64-apple-watchos-sim",
  #  "x86_64-apple-watchos-sim",
  #  "x86_64h-apple-darwin",
]
